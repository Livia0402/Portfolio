<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Puppy Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Language + dark mode toggles -->
  <div class="topbar">
    <button class="icon-btn" id="lang-toggle" type="button" aria-label="Switch language">🇧🇷 PT</button>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
  </div>

  <main>
    <!-- ============ DETECTOR ============ -->
    <section class="card" id="detector">
      <h1 data-i18n="title"></h1>
      <p data-i18n="intro"></p>

      <button class="btn" id="start-btn" type="button" data-i18n="start"></button>

      <!-- Drag & drop / click upload -->
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <input type="file" id="file-input" accept="image/*" hidden />
        <span data-i18n="dropHint"></span>
      </div>

      <p class="status" id="status"></p>

      <div class="stage">
        <div id="webcam-container" class="hidden"></div>
        <img id="preview" class="hidden" alt="Uploaded dog" />
      </div>

      <!-- Only the top 3 guesses are shown -->
      <div id="results" class="hidden">
        <h3 id="top-title" data-i18n="topGuesses"></h3>
        <p class="unsure hidden" id="unsure"></p>
        <div id="result-rows"></div>
        <button class="btn hidden" id="learn-btn" type="button"></button>
      </div>

      <!-- Random fact -->
      <div class="fact-area">
        <button class="btn btn-ghost" id="fact-btn" type="button" data-i18n="factBtn"></button>
        <div class="bubble hidden" id="fact-bubble"></div>
      </div>
    </section>

    <!-- ============ BREED CAROUSEL ============ -->
    <section class="card">
      <h2 data-i18n="breedsTitle"></h2>
      <p class="muted" data-i18n="breedsHint"></p>
      <div class="carousel-wrap">
        <button class="arrow" id="prev" type="button" aria-label="Previous">‹</button>
        <div class="carousel" id="carousel"></div>
        <button class="arrow" id="next" type="button" aria-label="Next">›</button>
      </div>
    </section>

    <!-- ============ ABOUT THE CREATOR ============ -->
    <section class="card">
      <h2 data-i18n="aboutTitle"></h2>
      <p data-i18n="aboutText"></p>
      <button class="btn" type="button" id="creator-btn" data-i18n="meet"></button>
    </section>

    <!-- ============ UPCOMING FEATURES ============ -->
    <section class="card">
      <h2 data-i18n="upcomingTitle"></h2>
      <p class="muted" data-i18n="upcomingHint"></p>
      <div id="upcoming-list"></div>
    </section>

    <!-- ============ SUGGESTIONS ============ -->
    <section class="card">
      <h2 data-i18n="suggestTitle"></h2>
      <p data-i18n="suggestIntro"></p>
      <form id="suggest-form" class="suggest-form">
        <input type="text" id="sug-name" data-i18n-placeholder="sugName" />
        <select id="sug-type">
          <option value="breed" data-i18n="sugTypeBreed"></option>
          <option value="feature" data-i18n="sugTypeFeature"></option>
          <option value="bug" data-i18n="sugTypeBug"></option>
        </select>
        <textarea id="sug-msg" rows="4" required data-i18n-placeholder="sugMsg"></textarea>
        <button class="btn" type="submit" data-i18n="sugSend"></button>
        <p class="form-note hidden" id="sug-note"></p>
      </form>
    </section>
  </main>

  <!-- ============ MODALS ============ -->
  <div class="modal" id="creator-modal">
    <div class="modal-box">
      <button class="modal-close" type="button" aria-label="Close">×</button>
      <img alt="Creator photo" class="avatar" />
      <h3 id="creator-name"></h3>
      <p class="bio" data-i18n="creatorBio"></p>
      <div class="socials" id="socials"></div>
    </div>
  </div>

  <div class="modal" id="breed-modal">
    <div class="modal-box">
      <button class="modal-close" type="button" aria-label="Close">×</button>
      <img id="breed-img" class="breed-photo" alt="" />
      <h3 id="breed-name"></h3>
      <p id="breed-desc"></p>
      <ul id="breed-facts" class="facts"></ul>
    </div>
  </div>

  <!-- Safety net: the creator popup opens even if script.js has a problem -->
  <script>
    (function () {
      var modal = document.getElementById("creator-modal");
      document.getElementById("creator-btn").addEventListener("click", function () { modal.classList.add("open"); });
      modal.addEventListener("click", function (e) {
        if (e.target === modal || e.target.classList.contains("modal-close")) modal.classList.remove("open");
      });
    })();
  </script>

  <!-- Teachable Machine libraries (remove if you already include them) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script src="images.js"></script>
  <script src="script.js"></script>
</body>
</html>
